<!DOCTYPE html>
<html lang="en"><head>
<script src="demo-shim.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orphan Review — Next Gen Intern</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--border:#2a2a3a;
  --text:#e0e0e8;--muted:#777;--accent:#E85D9A;--accent2:#9B2D8E;
  --green:#00c853;--red:#ff1744;--orange:#ff9100;--blue:#448aff;--yellow:#ffd600;--cyan:#00bcd4}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface)}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px}
.nav a:hover,.nav a.active{color:var(--text);background:var(--surface2)}
.stats{display:flex;gap:10px;padding:14px 22px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:120px}
.stat-v{font-size:22px;font-weight:800}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.stat.tA .stat-v{color:var(--green)}
.stat.tB .stat-v{color:var(--yellow)}
.stat.tC .stat-v{color:var(--blue)}
.stat.tD .stat-v{color:var(--muted)}
.filters{display:flex;gap:8px;padding:10px 22px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.f-btn{padding:5px 14px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer}
.f-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:18px 22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.t-A{border-left:4px solid var(--green)}
.card.t-B{border-left:4px solid var(--yellow)}
.card.t-C{border-left:4px solid var(--blue)}
.card.t-D{border-left:4px solid var(--muted);opacity:0.75}
.card-imgs{display:flex;gap:2px;background:#000}
.card-imgs img{width:50%;height:160px;object-fit:cover;cursor:zoom-in}
.card-imgs .ph{width:100%;height:160px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.card-body{padding:12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-name{font-size:14px;font-weight:800;flex:1;line-height:1.3}
.tier-pill{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:800;flex-shrink:0}
.tier-A{background:var(--green);color:#000}
.tier-B{background:var(--yellow);color:#000}
.tier-C{background:var(--blue);color:#fff}
.tier-D{background:var(--muted);color:#000}
.card-meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.card-meta .score{color:var(--text);font-weight:700}
.card-notes{font-size:12px;line-height:1.4;color:#bbb;margin:6px 0}
.card-offer{display:inline-block;font-size:10px;background:var(--surface2);padding:2px 8px;border-radius:10px;color:var(--accent);margin-top:4px}
.sig-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sig{font-size:9px;background:var(--surface2);color:var(--muted);padding:1px 6px;border-radius:8px}
.dims{display:flex;gap:4px;margin-top:8px;font-size:10px}
.dim{flex:1;text-align:center;background:var(--surface2);padding:4px;border-radius:4px}
.dim-v{font-weight:800;font-size:13px}
.dim-l{color:var(--muted);font-size:8px;text-transform:uppercase;margin-top:1px}
.d0{color:var(--red)}.d1{color:var(--yellow)}.d2{color:var(--green)}
.actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.btn{padding:5px 10px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;flex:1}
.btn-rescue{background:var(--green);color:#000}
.btn-dismiss{background:var(--surface2);color:var(--muted)}
.dismissed{opacity:0.4}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style></head>
<body>
<div class="top">
  <div class="logo">Next Gen Intern — Orphan Review</div>
  <div class="nav">
    <a href="/">Main dashboard</a>
    <a href="/orphans" class="active">Orphans</a>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="filters">
  <span style="color:var(--muted);font-size:11px">Tier:</span>
  <button class="f-btn active" data-tier="all">All</button>
  <button class="f-btn" data-tier="A">A (rescue now)</button>
  <button class="f-btn" data-tier="B">B (nurture)</button>
  <button class="f-btn" data-tier="C">C (campaign)</button>
  <button class="f-btn" data-tier="D">D (skip)</button>
  <span style="width:1px;background:var(--border);height:18px;margin:0 8px"></span>
  <span style="color:var(--muted);font-size:11px">Status:</span>
  <button class="f-btn active" data-status="all">All</button>
  <button class="f-btn" data-status="reviewed">Reviewed</button>
  <button class="f-btn" data-status="rescued">Rescued</button>
  <button class="f-btn" data-status="dismissed">Dismissed</button>
  <span style="flex:1"></span>
  <button class="f-btn" onclick="load()" style="color:var(--accent);border-color:var(--accent)">↻ Refresh</button>
</div>
<div id="grid" class="grid"></div>

<script>
let currentTier='all', currentStatus='all';
const esc=s=>(s||'').toString().replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const imgUrl=p=>p?'/api/orphans/image?path='+encodeURIComponent(p):'';

async function load(){
  const stats=await fetch('/api/orphans/stats').then(r=>r.json());
  const total=Object.values(stats).reduce((a,b)=>a+b,0);
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-v">${total}</div><div class="stat-l">Reviewed</div></div>
    <div class="stat tA"><div class="stat-v">${stats.A||0}</div><div class="stat-l">Tier A</div></div>
    <div class="stat tB"><div class="stat-v">${stats.B||0}</div><div class="stat-l">Tier B</div></div>
    <div class="stat tC"><div class="stat-v">${stats.C||0}</div><div class="stat-l">Tier C</div></div>
    <div class="stat tD"><div class="stat-v">${stats.D||0}</div><div class="stat-l">Tier D</div></div>
  `;
  const url='/api/orphans?tier='+currentTier+'&status='+currentStatus;
  const rows=await fetch(url).then(r=>r.json());
  const grid=document.getElementById('grid');
  if(!rows.length){grid.innerHTML='<div class="empty">No orphans matching this filter yet. Rubric review may still be running.</div>';return;}
  grid.innerHTML=rows.map(o=>{
    const dimVal=(k)=>{const v=o[k]||0;return `<div class="dim"><div class="dim-v d${v}">${v}</div><div class="dim-l">${k.replace(/_/g,' ').replace('visual pain','vis').replace('activity ','').replace('vertical ','').replace('self ','')}</div></div>`;};
    return `<div class="card t-${o.tier} ${o.status==='dismissed'?'dismissed':''}">
      <div class="card-imgs">
        ${o.screenshot_web?`<img src="${imgUrl(o.screenshot_web)}" loading="lazy" onclick="window.open(this.src,'_blank')">`:'<div class="ph">no web</div>'}
        ${o.screenshot_ig?`<img src="${imgUrl(o.screenshot_ig)}" loading="lazy" onclick="window.open(this.src,'_blank')">`:'<div class="ph">no IG</div>'}
      </div>
      <div class="card-body">
        <div class="card-head">
          <div class="card-name">${esc(o.display_name)}</div>
          <span class="tier-pill tier-${o.tier}">${o.tier} · ${o.score}/10</span>
        </div>
        <div class="card-meta">${esc(o.vertical||'other')}${o.disqualifier?' · <span style="color:var(--red)">⚠ '+esc(o.disqualifier)+'</span>':''}</div>
        <div class="card-notes">${esc(o.visual_notes||'')}</div>
        ${o.primary_offer?`<span class="card-offer">→ ${esc(o.primary_offer)}</span>`:''}
        <div class="dims">
          ${dimVal('web_visual_pain')}
          ${dimVal('ig_visual_pain')}
          ${dimVal('activity_pulse')}
          ${dimVal('vertical_fit')}
          ${dimVal('self_managed')}
        </div>
        ${o.signals&&o.signals.length?`<div class="sig-row">${o.signals.map(s=>'<span class="sig">'+esc(s)+'</span>').join('')}</div>`:''}
        <div class="actions">
          ${o.status==='rescued'?'<div style="color:var(--green);font-size:11px;text-align:center;flex:1">✓ Rescued to leads</div>':
            o.status==='dismissed'?'<div style="color:var(--muted);font-size:11px;text-align:center;flex:1">· dismissed ·</div>':
            `<button class="btn btn-rescue" onclick="rescue('${esc(o.slug)}')">Rescue to Leads</button>
             <button class="btn btn-dismiss" onclick="dismiss('${esc(o.slug)}')">Dismiss</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function rescue(slug){
  if(!confirm('Promote this orphan to a full lead?'))return;
  const r=await fetch('/api/orphans/'+encodeURIComponent(slug)+'/rescue',{method:'POST'}).then(r=>r.json());
  if(r.ok){await load();}else{alert('Failed to rescue');}
}
async function dismiss(slug){
  const r=await fetch('/api/orphans/'+encodeURIComponent(slug)+'/dismiss',{method:'POST'}).then(r=>r.json());
  if(r.ok)load();
}

document.querySelectorAll('.f-btn[data-tier]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.f-btn[data-tier]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentTier=b.dataset.tier;load();
});
document.querySelectorAll('.f-btn[data-status]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.f-btn[data-status]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentStatus=b.dataset.status;load();
});
load();
// Auto-refresh every 10s while review runs
setInterval(load, 10000);
</script>
</body></html>
