            </div>

            <!-- Big phone CTA -->
            <div style="margin-bottom:14px;text-align:center">
              ${phoneClean ? `<a href="tel:${esc(phoneClean)}" class="btn"
                style="background:#00C853;color:#fff;font-size:18px;font-weight:800;padding:14px 28px;text-decoration:none;border-radius:10px;display:inline-block;box-shadow:0 2px 8px rgba(0,100,0,0.2)">
                📞 ${esc(l.contact_phone||'')}
              </a>` : `<div style="font-size:13px;color:#7a5400;padding:10px;background:#FFF3E0;border-radius:8px">
                ⚠ No phone number stored — try email or DM instead.
              </div>`}
            </div>

            <!-- OUTCOME BUTTONS -->
            <div style="border-top:1px dashed rgba(0,100,0,0.25);padding-top:12px">
              <div style="font-size:10px;font-weight:700;color:#1B5E20;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">After the call — mark outcome</div>
              <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
                <button class="btn btn-sm" style="background:#2ecc71;color:#fff;font-weight:700"
                  onclick="showBookingForm(${l.id||0})">📅 Booked meeting</button>
                <button class="btn btn-sm" style="background:#f39c12;color:#fff"
                  onclick="markCallOutcome(${l.id||0}, 'no_answer')">📞 No answer (+2d)</button>
                <button class="btn btn-sm" style="background:#3498db;color:#fff"
                  onclick="markCallOutcome(${l.id||0}, 'callback_later')">⏰ Callback later (+7d)</button>
                <button class="btn btn-sm" style="background:#27ae60;color:#fff"
                  onclick="markCallOutcome(${l.id||0}, 'interested')">✅ Interested → proposal</button>
                <button class="btn btn-sm" style="background:#9b59b6;color:#fff"
                  onclick="markCallOutcome(${l.id||0}, 'send_email')">📨 Email instead</button>
                <button class="btn btn-sm" style="background:#7f8c8d;color:#fff"
                  onclick="markCallOutcome(${l.id||0}, 'not_interested')">❌ Not interested</button>
              </div>
            </div>

            <!-- INLINE BOOKING FORM (hidden until "Booked meeting" clicked) -->
            <div id="bookingForm-${l.id||0}" style="display:none;margin-top:12px;padding:12px;background:#fff;border-radius:8px;border:2px solid #2ecc71">
              <div style="font-weight:700;color:#1B5E20;font-size:13px;margin-bottom:10px">📅 Book the meeting</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
                <div><label style="font-size:10px;color:#5e6e62">Date</label>
                  <input type="date" id="bmDate-${l.id||0}" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:13px"></div>
                <div><label style="font-size:10px;color:#5e6e62">Time</label>
                  <input type="time" id="bmTime-${l.id||0}" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:13px"></div>
              </div>
              <div style="margin-bottom:8px"><label style="font-size:10px;color:#5e6e62">Method</label>
                <select id="bmMethod-${l.id||0}" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:13px">
                  <option value="Zoom">Zoom call</option>
                  <option value="Phone">Phone call</option>
                  <option value="Google Meet">Google Meet</option>
                  <option value="In-person">In-person</option>
                </select></div>
              <div style="margin-bottom:10px"><label style="font-size:10px;color:#5e6e62">Agenda / notes</label>
                <textarea id="bmAgenda-${l.id||0}" rows="2" placeholder="Discovery call — review proposal and pricing"
                  style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:12px;font-family:inherit">Discovery call — review proposal and pricing</textarea></div>
              <div style="display:flex;gap:8px">
                <button class="btn btn-sm" style="background:#2ecc71;color:#fff;flex:1"
                  onclick="submitBooking(${l.id||0})">✓ Save meeting</button>
                <button class="btn btn-sm btn-ghost"
                  onclick="document.getElementById('bookingForm-${l.id||0}').style.display='none'">Cancel</button>
              </div>
            </div>

          </div>
        </div>
        ` : ''}
    </div>`;

  // Pitch summary (only if we have value data) — renders compactly.
  // v4: currency symbol resolves from lead.market (was hardcoded €). The
  // value_json column values are *already* in the lead's local currency —
  // estimate_pitched_value in scripts/validate_leads.py applies market_mult
  // before persisting.
  const pitchHtml = (()=>{ try{
    const v = JSON.parse(l.value_json || '{}');
    if (!v.offer) return '';
    const symMap = {GR:'€', GR_REG:'€', CY:'€', US:'$', US_PREM:'$', US_NSC:'$', US_T2:'$',
                    UK:'£', UK_REG:'£', AU:'A$', AU_PREM:'A$', AU_REG:'A$',
                    CA:'C$', NZ:'NZ$', TR:'₺', NO:'kr', '': '€'};
    const sym = symMap[(l.market||'').toUpperCase()] || '€';
    return `<div class="lead-section lead-pitch">
      <div class="lead-section-label">💰 Pitch · Revenue potential</div>
      <div class="lead-pitch-offer">${esc(v.offer)}</div>
      <div class="lead-pitch-numbers">
        First sale <b>${sym}${v.one_time_low_eur}–${v.one_time_high_eur}</b>
        ${v.retainer_monthly_high_eur ? `· Retainer <b>${sym}${v.retainer_monthly_low_eur}–${v.retainer_monthly_high_eur}/mo</b>` : ''}
        <br><b>12-mo: ${sym}${(v.twelve_mo_total_low_eur||0).toLocaleString()}–${(v.twelve_mo_total_high_eur||0).toLocaleString()}</b>
      </div>
    </div>`;
  } catch(e){ return ''; }})();

  // Issues callout — kept for normal warnings, but the "🔴 Blocks send"
  // hard-block banner was per user feedback dropped 2026-05-11. If a lead
  // has issues we still note them, just without the alarmist heading.
  const issuesHtml = (()=>{ try{
    const issues = JSON.parse(l.issues_json || '[]');
    if (!issues.length) return '';
    return `<div class="lead-section lead-issues-warn">
      <div class="lead-section-label">⚠ ${issues.length} issue${issues.length>1?'s':''}</div>
      ${issues.map(iss=>`<div class="lead-issue-line"><b>${esc(iss.code)}</b> ${esc(iss.message)}</div>`).join('')}
    </div>`;
  } catch(e){ return ''; }})();

  document.getElementById('detPanel').innerHTML=`
    <div class="det-header">
      <div>
        <div class="det-title">${esc(l.company)}</div>
        <div class="lead-pill-row">${scorePill}${catPill}${stPill}</div>
      </div>
      <button class="det-close" onclick="closeDet()" aria-label="Close">&times;</button>
    </div>

    ${contactRow}

    <!-- ── Stage banner — current workflow position ────────────────────── -->
    ${(()=>{
      const stages = [
        {key:'grade',   label:'1. Grade',      done: l.manual_grade != null},
        {key:'pitch',   label:'2. Pick pitch', done: !!l.custom_pitch_json},
        {key:'draft',   label:'3. Draft',      done: l.status==='draft_ready' || l.status==='samples_needed' || l.status==='ready_to_call' || l.status==='outreach_sent'},
        {key:'samples', label:'4. Samples',    done: l.status==='ready_to_call' || l.status==='outreach_sent'},
        {key:'call',    label:'5. Call',       done: l.status==='outreach_sent'},
      ];
      const cur = stages.findIndex(s => !s.done);
      return `<div class="stage-bar">
        ${stages.map((s, i) => `<div class="stage-step ${s.done?'done':''} ${i===cur?'current':''}">${esc(s.label)}</div>`).join('')}
      </div>`;
    })()}

    <!-- ── Manual per-platform grade panel ─────────────────────────────────
         Grade each channel independently 1-10 (INVERTED scale per user
         2026-05-11): 1 = worst presence (they need us most) · 10 = perfect
         (skip). When ≥ 2 platforms are graded, the avg auto-routes:
           avg ≤ 4 → samples_needed (= make graphics list)
           avg ≥ 8 → manually_rejected
           else    → stay in current bucket -->
    ${(()=>{
      // Build a tiny inline scoring row per platform. The link button
      // opens the platform; the input next to it accepts a 1-10 grade.
      const platformRow = (icon, label, fieldName, url, urlOk) => {
        const cur = l[fieldName];
        const valAttr = cur != null && cur !== '' ? `value="${cur}"` : 'value=""';
        const openBtn = (url && urlOk)
          ? `<a class="btn btn-sm btn-ghost" href="${esc(url)}" target="_blank" rel="noopener"
              style="text-decoration:none;flex:1;min-width:140px">${icon} Open ${label}</a>`
          : `<div style="flex:1;min-width:140px;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:11px;font-style:italic">${icon} no ${label.toLowerCase()} URL</div>`;
        return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
          ${openBtn}
          <input type="number" min="1" max="10" step="1" ${valAttr}
            placeholder="—" title="${label}: 1=worst, 10=perfect"
            style="width:60px;padding:6px;border-radius:8px;border:1px solid var(--line);font-weight:800;font-size:15px;text-align:center"
            onchange="quickSave({${fieldName}: this.value ? Number(this.value) : null})">
        </div>`;
      };
      return `
        <div class="lead-section" style="background:rgba(255,255,255,0.65);padding:12px;border-radius:10px;margin:10px 0">
          <div class="lead-section-label" style="margin-bottom:6px">🔎 Grade each platform · 1 = worst (they need us) · 10 = perfect (skip)</div>
          ${platformRow('📍', 'Google Business', 'grade_google',    gbpClean, !!gbpClean)}
          ${platformRow('🌐', 'Website',         'grade_website',   webClean, webClean && !webIsJunk)}
          ${platformRow('📷', 'Instagram',       'grade_instagram', igClean,  !!igClean)}
          ${platformRow('📘', 'Facebook',        'grade_facebook',  fbClean,  !!fbClean)}
          <input type="text" placeholder="Grade notes (optional — why this grade?)"
            value="${esc(l.manual_grade_notes || '')}"
            style="width:100%;margin-top:8px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);font-size:12px"
            onchange="quickSave({manual_grade_notes: this.value})">

          <!-- "Generate pitch" advances the workflow: enabled once any platform
               is graded. Clicking it: (1) flips lead status → samples_needed
               so it moves into the Make Samples column, (2) loads the Pitch
               Builder so the user can review/customize before saving. -->
          <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button class="btn"
              ${l.manual_grade != null ? '' : 'disabled style="opacity:0.5;cursor:not-allowed"'}
              onclick="advanceToPitch(${l.id})">
              🎯 Generate pitch + move to Make Samples →
            </button>
            ${l.manual_grade != null ? '<span style="font-size:11px;color:#1f7a3d;font-style:italic">Grades saved · ready</span>' : '<span style="font-size:11px;color:var(--muted);font-style:italic">Grade any platform to enable</span>'}
          </div>
        </div>`;
    })()}

    <!-- ── Pitch Builder — only loaded once the lead has been graded. -->
    ${l.manual_grade != null ? `
      <div id="pitchBuilder-${l.id||0}" class="lead-pitch-builder"
           data-lead-id="${l.id||0}" style="margin:14px 0">Loading pitch…</div>
    ` : `
      <div style="padding:12px 14px;border-radius:10px;background:rgba(0,0,0,0.04);font-size:12px;color:var(--muted);font-style:italic;margin:14px 0">
        Grade any platform above to see the recommended pitch.
      </div>
    `}

    <!-- ── Sample mockups + Nano Banana generation + email composer ──── -->
    <div style="margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,0.6)">
      <div class="lead-section-label" style="margin-bottom:8px">📎 Sample mockups</div>
      <div id="samplesList-${l.id||0}" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted);font-style:italic">Loading samples…</div>

      <!-- Upload button -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <label class="btn btn-sm btn-ghost" style="cursor:pointer">
          📤 Upload image
          <input type="file" accept="image/*,.heic,.heif" multiple style="display:none"
            onchange="uploadSamples(${l.id||0}, this.files)">
        </label>
        <button class="btn btn-sm btn-ghost" onclick="toggleNanoPanel(${l.id||0})">
          🍌 Generate with Nano Banana Pro
        </button>
      </div>

      <!-- Nano Banana Pro generator panel — refs are transient, preview-first -->
      <div id="nanoPanel-${l.id||0}" style="display:none;margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:rgba(255,228,150,0.10)">
        <div style="font-size:11px;font-weight:800;color:#8a5400;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px">
          🍌 Nano Banana Pro · Gemini 2.5 Flash Image
        </div>

        <!-- Reference images: TRANSIENT — uploaded in browser memory only,
             never persisted to the lead's samples until you click Save. -->
        <div style="margin-bottom:10px">
          <label style="font-size:11px;font-weight:700;color:var(--muted)">Reference images (used by the model — not saved):</label>
          <div id="nanoRefList-${l.id||0}" style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0"></div>
          <label class="btn btn-sm btn-ghost" style="cursor:pointer;font-size:11px">
            + Add ref image
            <input type="file" accept="image/*,.heic,.heif" multiple style="display:none"
              onchange="addNanoRef(${l.id||0}, this.files)">
          </label>
          <button class="btn btn-sm btn-ghost" style="font-size:11px"
            onclick="clearNanoRefs(${l.id||0})">Clear refs</button>
        </div>

        <textarea id="nanoPrompt-${l.id||0}" rows="3" placeholder="Describe the mockup. e.g. 'Redesigned homepage hero — modern soft pastel palette, professional model photo, booking CTA prominent.'"
          style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;margin-bottom:8px"></textarea>

        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
          <label style="font-size:11px;font-weight:700;color:var(--muted)">Aspect:</label>
          <select id="nanoRatio-${l.id||0}" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px">
            <option value="square">Square (1:1)</option>
            <option value="vertical">Vertical (9:16)</option>
            <option value="horizontal" selected>Horizontal (16:9)</option>
            <option value="portrait">Portrait (4:5)</option>
          </select>
        </div>

        <button class="btn btn-sm" id="nanoGenBtn-${l.id||0}" onclick="generateNanoPreview(${l.id||0})"
          style="background:linear-gradient(180deg,#FFD700,#FFA500);color:#5a3a00;border:1px solid #d4a000">
          🍌 Generate preview
        </button>
        <span id="nanoStatus-${l.id||0}" style="margin-left:8px;font-size:11px;color:var(--muted)"></span>

        <!-- Preview area — shows the generated image with Save / Discard -->
        <div id="nanoPreview-${l.id||0}" style="margin-top:12px"></div>
      </div>

      <!-- Email composer -->
      <div id="composedEmail-${l.id||0}" style="margin-top:14px"></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line)">
        <button class="btn" onclick="composeLeadEmail(${l.id||0})">✉️ Compose email</button>
        <span style="font-size:11px;color:var(--muted);font-style:italic">
          Decision-tree template · grades + pitch + samples · no LLM
        </span>
      </div>
    </div>

    <!-- Notes — single textarea, always visible at the bottom. The rest
         of the old "More details" content has been retired (key problems,
         pitch document, score trios, signals row, completeness bar, etc).
         Anything still needed lives in its dedicated section above. -->
    <div style="margin:14px 0">
      <label class="lead-section-label" style="display:block;margin-bottom:6px">Notes</label>
      <textarea id="dNotes" rows="3" onchange="quickSave({notes:this.value})"
        style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:rgba(255,255,255,0.7)">${esc(l.notes||'')}</textarea>
    </div>

    <!-- Status changer + delete in a slim row. -->
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0">
      <label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Stage:</label>
      <select onchange="quickSave({status:this.value})" style="padding:6px 10px;border-radius:8px;border:1px solid var(--line)">
        ${STATUSES.map(s=>'<option value="'+s+'" '+(l.status===s?'selected':'')+'>'+STATUS_LABELS[s]+'</option>').join('')}
      </select>
    </div>

    <!-- Hidden legacy block — kept un-rendered to avoid breaking helper code
         that references its DOM ids. -->
    <div style="display:none">

    ${(budgetChip || ratingChip || addrChip) ? `<div class="lead-chip-row">${budgetChip}${ratingChip}${addrChip}</div>` : ''}

    <!-- ── 3-score trio (Fit / Pain / Reach) ── HubSpot 2024 lead-scoring
         pattern: parallel scores beat single composite for SMB outreach.
         Only outreach when ALL three are ≥4. Fit = vertical+market+budget,
         Pain = outdated site+stale social+low Lighthouse, Reach = email+IG. -->
    ${(()=>{
      const fit = l.fit_score, pain = l.pain_score, reach = l.reach_score;
      if (fit == null && pain == null && reach == null) return '';
      const q = v => v == null ? 'unknown' : (v >= 7 ? 'strong' : v >= 4 ? 'ok' : 'weak');
      const cell = (label, val) => `<div class="score-pill" data-quality="${q(val)}">
        <div class="score-pill-label">${label}</div>
        <div class="score-pill-value">${val == null ? '—' : Number(val).toFixed(1)}</div>
        <div class="score-pill-bar"><span style="width:${val == null ? 0 : Math.round((val/10)*100)}%"></span></div>
      </div>`;
      return `<div class="score-trio" title="HubSpot-style parallel scoring. Outreach only when all 3 ≥ 4.">
        ${cell('Fit', fit)}${cell('Pain', pain)}${cell('Reach', reach)}
      </div>`;
    })()}

    <!-- ── Proof signals row — hard evidence the enrichment bot found:
         tracking pixels (running ads = real budget), paid SaaS (calendly,
         booksy etc.), Lighthouse mobile score, booking widget, incumbent
         agency credit. Drives both pricing AND draft personalization. -->
    ${(()=>{
      const s = l.enrichment_signals || {};
      if (!s || (typeof s === 'string')) return '';
      const chips = [];
      const px = s.pixels || {};
      if (px.meta_pixel)  chips.push(`<span class="signal-chip" data-good="1">📊 Meta Pixel</span>`);
      if (px.google_ads)  chips.push(`<span class="signal-chip" data-good="1">📊 Google Ads</span>`);
      if (px.gtm)         chips.push(`<span class="signal-chip" data-good="1">📊 GTM</span>`);
      const sa = s.saas || {};
      ['calendly','booksy','fresha','setmore','square','opentable','shopify','mindbody']
        .forEach(k => { if (sa[k]) chips.push(`<span class="signal-chip" data-good="1">💳 ${k}</span>`); });
      const bk = s.booking || {};
      if (!bk.installed && (l.category||'').match(/(salon|hair|beauty|spa|dental|medical|groom|veterinar|wellness|aesthetic)/i))
        chips.push(`<span class="signal-chip" data-good="0">⚠ no booking widget</span>`);
      const lh = s.lighthouse || {};
      if (typeof lh.performance === 'number') {
        const good = lh.performance >= 70 ? 1 : (lh.performance >= 50 ? '' : 0);
        chips.push(`<span class="signal-chip" ${good!==''?'data-good="'+good+'"':''}>⚡ Lighthouse ${lh.performance}/100</span>`);
      }
      const inc = s.incumbent || {};
      if (inc.found) chips.push(`<span class="signal-chip" data-good="0">🚫 incumbent: ${esc((inc.credit_text||'').slice(0,30))}</span>`);
      return chips.length ? `<div class="signals-row">${chips.join('')}</div>` : '';
    })()}

    ${(()=>{
      const c = leadCompleteness(l);
      const barColor = c.pct >= 86 ? '#1f7a3d' : c.pct >= 57 ? '#d97a00' : '#c8154f';
      const label = c.ready ? '✅ Ready to contact' : (c.contactable ? `${c.pct}% complete` : `${c.pct}% — no contact channel yet`);
      const missing = c.missing.length ? `<span style="font-size:10px;color:var(--muted);font-style:italic;margin-left:8px">missing: ${c.missing.map(m=>m.replace(/_/g,' ')).join(', ')}</span>` : '';
      return `<div class="lead-completeness">
        <div class="lead-completeness-row">
          <span class="lead-completeness-label" style="color:${barColor}">${label}</span>
          ${missing}
        </div>
        <div class="lead-completeness-bar"><span style="width:${c.pct}%;background:${barColor}"></span></div>
      </div>`;
    })()}

    ${nextAction ? `<div class="lead-next-action"><span class="lead-next-label">Next</span><span class="lead-next-text">${esc(nextAction)}</span></div>` : ''}

    ${l.pitch_angle ? `<div class="lead-pitch-angle">${esc(l.pitch_angle)}</div>` : ''}

    <!-- Key Problems — the analyzed list of issues we're pitching against.
         Always shown if populated (was previously only inside the issues
         section, which only renders when has_blocker is set — many leads
         have problems but no blockers, so the list was hidden by default). -->
    ${(()=>{ try {
      const kp = JSON.parse(l.key_problems||'[]');
      if (!kp.length) return '';
      return `<div class="lead-section">
        <div class="lead-section-label">🎯 Key Problems</div>
        ${kp.map(p => `<div class="lead-issue-line">• ${esc(p)}</div>`).join('')}
      </div>`;
    } catch(e){ return ''; } })()}

    <!-- ── PITCH DOCUMENT ─────────────────────────────────────────────────
         Consolidated "what we're pitching this client" file. Combines:
           - the offer (from value_json.offer)
           - the pricing band (one-time + retainer)
           - the 12-month revenue potential
           - the pitch angle (LLM-written value prop)
           - the key problems we're solving
           - the service to deliver
         The team can copy this whole block to share in Slack / docs / a
         proposal. One canonical place per lead. -->
    <!-- (Pitch Builder hoisted to above the More-details accordion.
         Legacy 3-tier cards retired — superseded by the Pitch Builder.) -->
    <div id="pitchTiers-${l.id||0}" style="display:none"></div>

    ${(()=>{ try {
      const v = JSON.parse(l.value_json || '{}');
      const kp = JSON.parse(l.key_problems || '[]');
      if (!v.offer && !l.pitch_angle && !kp.length) return '';
      const docId = 'pitchDoc' + (l.id||0);
      const lines = [];
      lines.push(`📋 PITCH FOR: ${l.company || ''}`);
      if (l.industry) lines.push(`Industry: ${l.industry}`);
      if (l.market)   lines.push(`Market: ${l.market}`);
      if (l.score)    lines.push(`Lead score: ${l.score}/10`);
      lines.push('');
      if (v.offer) {

async function quickSave(fields){
  if(!editId)return;
  // Snapshot the pre-save state of fields that gate the "Generate pitch"
  // button + avg display, so we can decide if a re-render is needed.
  const preLead = allLeads.find(x => x.id === editId) || {};
  const wasGraded = preLead.manual_grade != null;
  const preStatus = preLead.status;

  await api('/api/leads/'+editId,'PUT',fields);
  await refresh();

  if (!editId) return;
  const postLead = allLeads.find(x => x.id === editId) || {};
  const isNowGraded = postLead.manual_grade != null;
  const statusChanged = postLead.status !== preStatus;
  // Re-render the panel ONLY when something structural changed:
  //  - lead just crossed the "first grade saved" threshold (enables button)
  //  - status flipped (e.g. user advanced the workflow)
  // Otherwise leave the DOM alone — re-rendering during grade typing was
  // clobbering the input the user just edited (the auto-delete bug).
  const needsRerender = (!wasGraded && isNowGraded) || statusChanged;
  if (needsRerender) {
    const stillOpen = document.getElementById('detPanel').classList.contains('open');
    if (stillOpen) openDet(editId);
  } else {
    // Lightweight in-place update: refresh the avg-display text + chips on
    // the lead card if needed. The grade inputs already have the right
    // value (they're the source of truth that just fired).
    const avgEl = document.querySelector('.lead-section [data-avg-display]');
    if (avgEl && postLead.manual_grade != null) {
      avgEl.textContent = postLead.manual_grade;
    }
  }
}

async function loadSamples(id){

  if (!samples.length){

    return;
  }
  root.innerHTML = samples.map(s => `

async function uploadSamples(id, files){
  if (!files || !files.length) return;
  const root = document.getElementById('samplesList-' + (id||0));
  if (root) root.innerHTML = `<span style="font-size:12px;color:var(--muted)">Uploading ${files.length} file(s)…</span>`;
  for (const file of files){
    const fd = new FormData();
    fd.append('file', file);
    const csrf = (document.cookie.match(/(?:^|; )ng_csrf=([^;]+)/) || [])[1] || '';
    const r = await fetch('/sales/api/leads/' + id + '/samples/upload', {
      method: 'POST', body: fd, credentials: 'same-origin',
      headers: csrf ? {'X-CSRF-Token': decodeURIComponent(csrf)} : {},
    });
    if (!r.ok){
      const txt = await r.text().catch(()=>'');
      alert(`Upload failed (${file.name}): ${r.status} ${txt.slice(0,200)}`);
      break;
    }
  }
  loadSamples(id);
}

async function deleteSample(id, name){
  if (!confirm('Remove ' + name + '?')) return;
  await api('/api/leads/' + id + '/samples/' + encodeURIComponent(name), 'DELETE');
  loadSamples(id);
}

// In-browser-only reference-image store. Refs are NEVER posted to the
// server until generation time, and even then they're not persisted.
const _nanoRefs = {};   // leadId → Array<File>
const _nanoPreview = {};// leadId → {b64, mime, aspect}

function addNanoRef(id, files){
  if (!_nanoRefs[id]) _nanoRefs[id] = [];
  for (const f of files){ _nanoRefs[id].push(f); }
  renderNanoRefs(id);
}
function removeNanoRef(id, idx){
  if (!_nanoRefs[id]) return;
  _nanoRefs[id].splice(idx, 1);
  renderNanoRefs(id);
}
function clearNanoRefs(id){ _nanoRefs[id] = []; renderNanoRefs(id); }

function renderNanoRefs(id){
  const root = document.getElementById('nanoRefList-' + id);
  if (!root) return;
  const refs = _nanoRefs[id] || [];
  if (!refs.length){
    root.innerHTML = '<span style="font-size:11px;color:var(--muted);font-style:italic">No refs added.</span>';
    return;
  }
  root.innerHTML = refs.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div style="position:relative;width:64px;height:64px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff">
      <img src="${url}" style="width:100%;height:100%;object-fit:cover">
      <button title="remove" onclick="removeNanoRef(${id}, ${i})"
        style="position:absolute;top:1px;right:1px;background:rgba(0,0,0,0.6);color:#fff;border:0;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1">×</button>
    </div>`;
  }).join('');
}

async function generateNanoPreview(id){
  const prompt = document.getElementById('nanoPrompt-' + id).value.trim();
  const ratio = document.getElementById('nanoRatio-' + id).value;
  const status = document.getElementById('nanoStatus-' + id);
  const btn = document.getElementById('nanoGenBtn-' + id);
  const preview = document.getElementById('nanoPreview-' + id);
  if (!prompt){ status.textContent = '✗ prompt required'; status.style.color = 'var(--red)'; return; }
  const refs = _nanoRefs[id] || [];
  status.style.color = 'var(--muted)';
  status.textContent = `Generating (${ratio}, ${refs.length} ref${refs.length===1?'':'s'})… ~15s`;
  btn.disabled = true; btn.style.opacity = 0.6;
  preview.innerHTML = '';
  // Use multipart so we can stream the ref images to Gemini.
  const fd = new FormData();
  fd.append('prompt', prompt);
  fd.append('aspect_ratio', ratio);
  for (const f of refs){ fd.append('refs', f); }
  const csrf = (document.cookie.match(/(?:^|; )ng_csrf=([^;]+)/) || [])[1] || '';
  try {
    const r = await fetch('/sales/api/leads/' + id + '/nano/preview', {
      method: 'POST', body: fd, credentials: 'same-origin',
      headers: csrf ? {'X-CSRF-Token': decodeURIComponent(csrf)} : {},
    });
    if (!r.ok){
      const txt = await r.text().catch(()=>'');
      throw new Error(`${r.status} ${txt.slice(0,200)}`);
    }
    const j = await r.json();
    _nanoPreview[id] = {b64: j.image_b64, mime: j.mime_type, aspect: j.aspect_ratio};
    status.textContent = `✓ Preview ready (${j.aspect_ratio})`;
    status.style.color = '#1f7a3d';
    preview.innerHTML = `
      <div style="padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff">
        <img src="data:${j.mime_type};base64,${j.image_b64}"
          style="max-width:100%;max-height:520px;border-radius:6px;display:block;margin:0 auto 10px"/>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <button class="btn" style="background:#1f7a3d;color:#fff" onclick="saveNanoPreview(${id})">
            💾 Save to client file
          </button>
          <button class="btn btn-ghost" onclick="discardNanoPreview(${id})">
            🗑 Discard
          </button>
          <button class="btn btn-ghost" onclick="generateNanoPreview(${id})">
            ↻ Re-generate
          </button>
        </div>
      </div>`;
  } catch(e){
    status.textContent = '✗ ' + e.message.slice(0, 200);
    status.style.color = 'var(--red)';
  } finally {
    btn.disabled = false; btn.style.opacity = 1;
  }
}

async function saveNanoPreview(id){
  const p = _nanoPreview[id];
  if (!p) return;
  const status = document.getElementById('nanoStatus-' + id);
  status.textContent = 'Saving…';
  try {
    const r = await api('/api/leads/' + id + '/nano/save-preview', 'POST', {
      image_b64: p.b64, mime_type: p.mime, aspect_ratio: p.aspect,
    });
    status.textContent = `✓ Saved as ${r.name}`;
    status.style.color = '#1f7a3d';
    _nanoPreview[id] = null;
    document.getElementById('nanoPreview-' + id).innerHTML = '';
    loadSamples(id);
  } catch(e){
    status.textContent = '✗ ' + e.message.slice(0, 200);
    status.style.color = 'var(--red)';
  }
}

function discardNanoPreview(id){
  _nanoPreview[id] = null;
  document.getElementById('nanoPreview-' + id).innerHTML = '';
  const status = document.getElementById('nanoStatus-' + id);
  status.textContent = 'discarded';

async function loadPitchBuilder(id){
  const root = document.getElementById('pitchBuilder-' + (id||0));

  try { data = await api('/api/leads/' + id + '/pitch'); }
  catch(e){ root.innerHTML = ''; return; }

  renderPitchBuilder(id, data);

function renderPitchBuilder(id, data){
  const root = document.getElementById('pitchBuilder-' + (id||0));
  if (!root) return;
  const sym = data.currency_symbol || '€';
  const selection = _pitchByLead[id] || new Set();
  // Group services by category for visual organization.
  const groups = {};
  (data.catalog || []).forEach(s => {
    (groups[s.category] = groups[s.category] || []).push(s);
  });
  const catOrder = ['Website','Google','Social','Brand','Content','Email','Ads'];
  const cats = Object.keys(groups).sort((a,b) => {
    const ai = catOrder.indexOf(a); const bi = catOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  // Live totals — recompute from in-memory selection (not server-side).
  let oneLo=0, oneHi=0, moLo=0, moHi=0;
  (data.catalog || []).forEach(s => {
    if (!selection.has(s.key) || !s.price_low) return;
    if (s.cadence === 'monthly') { moLo += s.price_low; moHi += s.price_high || s.price_low; }
    else                          { oneLo += s.price_low; oneHi += s.price_high || s.price_low; }
  });
  const annLo = moLo * 10, annHi = moHi * 10;  // save 2 months on annual prepay

  const isAuto = (key) => (data.auto_selected || []).includes(key);
  const isOn   = (key) => selection.has(key);

  const catRow = (cat) => `
    <div class="pb-cat-label">${esc(cat)}</div>
    ${groups[cat].map(s => `
      <label class="pb-row ${isOn(s.key) ? 'is-on' : ''}">
        <input type="checkbox" ${isOn(s.key) ? 'checked' : ''}
          onchange="togglePitchService(${id}, '${esc(s.key)}', this.checked)">
        <div class="pb-row-body">
          <div class="pb-row-title">
            ${esc(s.name)}

async function togglePitchService(id, key, on){
  const sel = _pitchByLead[id] || new Set();
  if (on) sel.add(key); else sel.delete(key);
  _pitchByLead[id] = sel;
  // Auto-save on every toggle — user explicitly asked for the selection
  // to persist without needing to click a Save button.
  try {
    await api('/api/leads/' + id + '/pitch', 'POST',
              {selected_keys: Array.from(sel), notes: ''});
  } catch(e){ /* silent — the toggle still works in-memory */ }
  api('/api/leads/' + id + '/pitch').then(data => {
    data.selected_keys = Array.from(sel);
    renderPitchBuilder(id, data);
  });
}

async function savePitchSelection(id){
  const sel = Array.from(_pitchByLead[id] || []);
  await api('/api/leads/' + id + '/pitch', 'POST', {selected_keys: sel, notes: ''});

  const btn = event.target;
  const old = btn.textContent;
  btn.textContent = '✓ Saved';
  btn.style.background = '#1f7a3d';
  setTimeout(() => { btn.textContent = old; btn.style.background = ''; }, 1200);
  // Reload so saved_at refreshes
  loadPitchBuilder(id);
}

function resetPitchToAuto(id){

async function copyPitchToClipboard(id){
  const data = await api('/api/leads/' + id + '/pitch');
  const sel = _pitchByLead[id] || new Set(data.selected_keys || []);
  const services = (data.catalog || []).filter(s => sel.has(s.key));
  const lead = allLeads.find(x => x.id === id) || {};
  const sym = data.currency_symbol || '€';
  let oneLo=0, oneHi=0, moLo=0, moHi=0;
  services.forEach(s => {
    if (!s.price_low) return;
    if (s.cadence === 'monthly') { moLo += s.price_low; moHi += s.price_high || s.price_low; }
    else { oneLo += s.price_low; oneHi += s.price_high || s.price_low; }
  });
  const lines = [
    `${lead.company || ''} — Proposal`,
    '',
    'SERVICES:',
    ...services.map(s => `  • ${s.name}${s.price_band ? '  ' + s.price_band : ''}`),
    '',
    'PRICING:',
    oneHi ? `  💼 One-time:  ${sym}${oneLo.toLocaleString()}–${oneHi.toLocaleString()}` : '',
    moHi  ? `  📅 Monthly:   ${sym}${moLo.toLocaleString()}–${moHi.toLocaleString()}/mo` : '',
    moHi  ? `  🎯 Annual:    ${sym}${(moLo*10).toLocaleString()}–${(moHi*10).toLocaleString()}/yr (save 2 months)` : '',
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(lines).then(() => {
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.textContent = old; }, 1500);
  });
}

async function markCallOutcome(id, outcome){
  // Maps the button click to a status + next_action_date + notes append.
  // All outcomes use the existing PUT /api/leads endpoint — no new server route needed.
  const now = new Date();
  const fmt = (d) => d.toISOString().split('T')[0];
  const recipes = {
    'no_answer':       { status: 'ready_to_call', next_action: 'Retry call', next_action_date: fmt(new Date(now.getTime() + 2*86400000)), note: '📞 No answer — retry in 2 days' },
    'callback_later':  { status: 'ready_to_call', next_action: 'Callback', next_action_date: fmt(new Date(now.getTime() + 7*86400000)), note: '⏰ Asked for callback in ~1 week' },
    'interested':      { status: 'responded', response_type: 'interested', next_action: 'Send proposal', next_action_date: fmt(now), note: '✅ Interested on call — send proposal' },
    'send_email':      { status: 'draft_ready', next_action: 'Send email follow-up', next_action_date: fmt(now), note: '📨 Couldn\'t connect on call — switch to email' },
    'not_interested':  { status: 'lost', deal_status: 'lost', next_action: '', note: '❌ Not interested on call' },
  };
  const recipe = recipes[outcome];
  if (!recipe) return;
  const lead = allLeads.find(x => x.id === id) || {};
  const oldNotes = lead.notes || '';
  const ts = now.toISOString().split('T')[0];
  const newNote = `[${ts} call] ${recipe.note}\n\n${oldNotes}`.substring(0, 8000);
  const payload = { status: recipe.status, notes: newNote };
  if (recipe.next_action) payload.next_action = recipe.next_action;
  if (recipe.next_action_date) payload.next_action_date = recipe.next_action_date;
  if (recipe.response_type) payload.response_type = recipe.response_type;
  if (recipe.deal_status) payload.deal_status = recipe.deal_status;
  await api('/api/leads/' + id, 'PUT', payload);
  closeDet();
  refresh();
}

// Click-to-edit a contact field (email, phone, website, IG, FB, TT, LinkedIn,
// contact_name). Replaces the row with an inline input; saves on blur OR
// Enter; reverts on Escape. Persists to leads.db immediately so the manual
// add survives reloads. The bot's enrichment cron will not re-overwrite a
// manually-set field — `_enrich_one_sync` only fills empty fields.
async function editContactField(field, type, placeholder){
  if(!editId) return;
  const lead = allLeads.find(x => x.id === editId);
  if(!lead) return;
  const row = document.querySelector(`.lead-contact-row[data-field="${field}"]`);
  if(!row) return;
  const display = row.querySelector('.lead-contact-display');
  const editBtn = row.querySelector('.lead-edit-btn');
  const current = lead[field] || '';
  const oldHtml = display.innerHTML;

  const input = document.createElement('input');
  input.type = type || 'text';
  input.value = current;
  input.placeholder = placeholder;
  input.style.cssText = 'flex:1;padding:6px 10px;border:1px solid var(--accent);'
    + 'border-radius:6px;background:rgba(255,255,255,0.95);color:#2a1a3a;'
    + 'font-size:14px;outline:none;min-height:32px;';
  display.innerHTML = '';
  display.appendChild(input);
  input.focus(); input.select();
  if(editBtn) editBtn.style.visibility = 'hidden';

  let saved = false;
  const finish = async (commit) => {
    if(saved) return; saved = true;
    if(commit){
      const newVal = input.value.trim();
      if(newVal !== (current || '')){
        try {
          await api('/api/leads/'+editId, 'PUT', {[field]: newVal});
          lead[field] = newVal;
          await refresh();
          openDet(editId);
          return;
        } catch(e) {
          alert('Save failed: '+(e.message||'unknown'));
        }
      }
    }
    display.innerHTML = oldHtml;
    if(editBtn) editBtn.style.visibility = '';
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
}

async function composeWithAssets(action){

  const l = allLeads.find(x => x.id === editId);
  if(!l) return;
  const to = l.contact_email || document.getElementById('dEmail')?.value;
  if(!to){ alert('Set contact email first.'); return; }
  const draft = document.getElementById('dDraft')?.value || l.email_draft;
  if(!draft){ alert('Generate a draft first.'); return; }
  const cbs = document.querySelectorAll('#assetsList .asset-cb:checked');
  const asset_keys = Array.from(cbs).map(cb => ({task_id: cb.dataset.task, filename: cb.dataset.name}));
  if(action === 'send' && !confirm(`Send email to ${to} with ${asset_keys.length} attachment(s)?`)) return;
  const status = document.getElementById('assetsStatus');
  const draftBtn = document.getElementById('btnDraftWithAssets');
  const sendBtn  = document.getElementById('btnSendWithAssets');
  draftBtn.disabled = true; sendBtn.disabled = true;
  status.style.display = 'block';

  status.style.color = '#bbb';
  status.textContent = (action === 'send' ? 'Sending' : 'Building Gmail draft') + ' with ' + asset_keys.length + ' attachment(s)…';
  try {
    const r = await api('/api/leads/'+editId+'/email-with-assets', 'POST', {
      to, subject: 'Quick idea for ' + (l.company || 'your business'),
      body: draft, asset_keys, action,
    });

    status.style.color = '#7be3a4';
    status.textContent = '✓ ' + (action === 'send'
      ? 'Email sent! Message ID: ' + (r.message_id || '?')
      : 'Draft saved to Gmail. ' + (r.attached || 0) + ' attachment(s).');
    if(action === 'send'){
      await api('/api/leads/'+editId, 'PUT', {status: 'outreach_sent'});
      await refresh();
    }
  } catch(e){
    status.style.background = 'rgba(255,23,68,0.15)';
    status.style.color = '#ff8888';
    status.textContent = 'Failed: ' + (e.message || 'unknown');

  draftBtn.disabled = false; sendBtn.disabled = false;
}

// Lead enrichment: GMaps lookup + website scrape, fills only empty fields.
// Backend endpoint: POST /api/leads/{id}/enrich. Returns {diff, sources, warnings}.
async function enrichLead(opts){
  if(!editId) return;
  const btn = document.getElementById('btnEnrichContact');
  const status = document.getElementById('enrichStatus');
  if(!btn || !status) return;
  const oldLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Enriching…';
  status.style.display = 'block';
  status.style.background = 'rgba(68,138,255,0.15)';
  status.style.color = '#7eb1ff';
  status.textContent = 'Looking up Google Maps and scraping the website…';
  try {
    const r = await api('/api/leads/'+editId+'/enrich', 'POST');
    const diff = r.diff || {};
    if(Object.keys(diff).length){
      status.style.background = 'rgba(0,200,83,0.18)';
      status.style.color = '#7be3a4';
      status.textContent = '✓ '+r.message+' Filled: '+Object.keys(diff).join(', ')+'.';

    } else if((r.warnings||[]).length) {
      status.style.background = 'rgba(255,145,0,0.15)';
      status.style.color = '#ffb060';
      status.textContent = (r.message||'No new info found.') + ' ('+r.warnings.join('; ')+')';
    } else {
      status.style.background = 'rgba(255,255,255,0.1)';
      status.style.color = '#bbb';
      status.textContent = r.message || 'No new info found.';
    }
  } catch(e){
    status.style.background = 'rgba(255,23,68,0.15)';
    status.style.color = '#ff8888';
    status.textContent = 'Enrich failed: '+(e.message||'unknown');
  }
  btn.disabled = false;
  btn.textContent = oldLabel;
}
async function doAnalyze(){
  if(!editId)return;const btn=document.getElementById('btnAnalyze');btn.textContent='Analyzing...';btn.disabled=true;
  const r=await api('/api/leads/'+editId+'/analyze','POST');
  btn.textContent='Analyze';btn.disabled=false;
  if(r&&!r.error){await refresh();openDet(editId);}else{alert('Analysis failed');}
}
async function doDraft(){
  if(!editId)return;const btn=document.getElementById('btnDraft');btn.textContent='Drafting...';btn.disabled=true;
  const r=await api('/api/leads/'+editId+'/draft','POST');
  btn.textContent='Generate Draft';btn.disabled=false;
  if(r&&r.draft){await refresh();openDet(editId);}else{alert('Draft failed');}
}
async function saveToGmail(){
  if(!editId)return;const l=allLeads.find(x=>x.id===editId);if(!l)return;
  // Hard block on blocker-level issues
  if(l.has_blocker){
    try{
      const issues=JSON.parse(l.issues_json||'[]').filter(i=>i.severity==='blocker');
      const msg='⚠️ BLOCKED — fix these before sending:\n\n'+issues.map(i=>'• '+i.code+': '+i.message).join('\n');
      alert(msg);
    }catch(e){alert('Lead has blocker issues — fix them first');}
    return;
  }
  const draft=document.getElementById('dDraft')?.value||l.email_draft;
  const email=l.contact_email||document.getElementById('dEmail')?.value;
  if(!email){alert('Set contact email first');return;}
  if(!draft){alert('Generate a draft first');return;}
  const r=await api('/api/gmail/draft','POST',{to:email,subject:'Quick idea for '+l.company,body:draft,lead_id:editId});
  if(r&&r.ok){
    const att=r.attached?` (${r.attached} photos attached)`:' (no enhanced photos yet — use Enhance Photos)';
    alert('Draft saved to Gmail'+att);
    await api('/api/leads/'+editId,'PUT',{status:'draft_ready'});await refresh();
  }
}
function openEnhance(){if(editId)window.open('/enhance/'+editId,'_blank');}
async function delLead(){if(!editId||!confirm('Delete this lead?'))return;await api('/api/leads/'+editId,'DELETE');closeDet();await refresh();}

// --- Layer 3: Fact-check review panel ---
function renderFactCheck(data){
  const block=document.getElementById('factsBlock');if(!block)return;
  const verdict=data.audit?.verdict||data.accuracy||'unknown';
  const claims=data.audit?.claims||[];
  block.innerHTML=`
    <div class="det-label" style="margin-top:4px">Verified Fact Sheet
      <span class="accuracy-badge accuracy-${verdict}">${verdict}</span>
    </div>
    <div class="fact-sheet">${esc(data.fact_sheet||'')}</div>
    ${claims.length?`
      <div class="det-label" style="margin-top:10px">Claim-by-claim audit (${claims.length})</div>
      <div class="claims-list">
        ${claims.map(c=>`<div class="claim-row claim-${c.status}">
          <span class="claim-tag">${c.status==='SUPPORTED'?'OK':c.status==='UNSUPPORTED'?'?':'✗'}</span>
          <div class="claim-text">${esc(c.claim)}<div class="claim-reason">${esc(c.reason||'')}</div></div>
        </div>`).join('')}
      </div>`:'<div style="color:var(--muted);font-size:11px;margin-top:6px">No audit run yet — click Re-audit.</div>'}
  `;
  block.style.display='block';
}
async function loadFacts(){
  if(!editId)return;
  const r=await fetch('/api/leads/'+editId+'/facts').then(x=>x.json()).catch(()=>null);
  if(r)renderFactCheck(r);
}
async function reAudit(){
  if(!editId)return;
  const btn=document.getElementById('btnReaudit');btn.textContent='Auditing...';btn.disabled=true;
  await api('/api/leads/'+editId+'/audit-draft','POST');
  btn.textContent='Re-audit';btn.disabled=false;
  await loadFacts();await refresh();
}
async function approveDraft(){
  if(!editId)return;
  await api('/api/leads/'+editId+'/approve-draft','POST');
  await refresh();openDet(editId);
}
async function rejectDraft(){
  if(!editId||!confirm('Clear this draft so it can be regenerated?'))return;
  await api('/api/leads/'+editId+'/reject-draft','POST');
  await refresh();openDet(editId);
}

// Photo enrichment + rendering
function renderPhotos(photos){
  const block=document.getElementById('photosBlock');if(!block)return;
  if(!photos||!photos.length){
    block.innerHTML='<div style="color:var(--muted);font-size:11px">No photos enriched yet — click "Enrich Photos".</div>';
    block.style.display='block';return;
  }
  block.innerHTML=`
    <div class="det-label" style="margin-top:4px">Photos reviewed (${photos.length})</div>
    <div class="photo-grid">${photos.map(p=>`
      <div class="photo-tile" onclick="window.open('${p.url}','_blank')">
        <img src="${p.thumb_url||p.url}" loading="lazy" onerror="this.style.opacity=0.2">
        <span class="photo-src">${p.source}</span>
        ${p.grade?`<span class="photo-grade g-${p.grade}">${p.grade}</span>`:''}
        <div class="photo-desc">${esc(p.content_desc||'')}</div>
      </div>`).join('')}</div>
    ${photos.some(p=>p.observations&&p.observations.length)?`
      <div class="det-label" style="margin-top:8px">Observations</div>
      <div style="font-size:11px;color:#bbb;line-height:1.6">
        ${[...new Set(photos.flatMap(p=>p.observations||[]))].map(o=>'· '+esc(o)).join('<br>')}
      </div>`:''}
  `;
  block.style.display='block';
}
async function loadPhotos(){
  if(!editId)return;
  const r=await fetch('/api/leads/'+editId+'/photos').then(x=>x.json()).catch(()=>null);
  if(r)renderPhotos(r.photos);
}
async function enrichPhotos(){
  if(!editId)return;
  const btn=document.getElementById('btnEnrich');btn.textContent='Enriching... (up to 2 min)';btn.disabled=true;
  try{
    const r=await api('/api/leads/'+editId+'/enrich-photos','POST');
    if(!r||!r.ok){alert('Enrichment had issues:\n'+((r&&r.stderr)||'unknown'));}
  }catch(e){alert('Error: '+e);}
  btn.textContent='Enrich Photos';btn.disabled=false;
  await loadPhotos();
}

// New lead
function openNew(){
  editId=null;
  document.getElementById('detPanel').innerHTML=`
    <div class="det-header"><div class="det-title">New Lead</div><button class="det-close" onclick="closeDet()">&times;</button></div>
    <div class="det-field"><label>Company *</label><input id="nCompany"></div>
    <div class="det-field"><label>Contact Name</label><input id="nContact"></div>
    <div class="det-field"><label>Contact Email</label><input id="nEmail"></div>
    <div class="det-field"><label>Phone</label><input id="nPhone"></div>
    <div class="det-field"><label>Industry</label><input id="nIndustry" placeholder="beauty, restaurant, pet..."></div>
    <div class="det-field"><label>Website</label><input id="nWeb" placeholder="https://"></div>
    <div class="det-field"><label>Market</label><select id="nMarket"><option>AU</option><option>US</option><option>UK</option><option>CA</option><option>NZ</option><option>GR</option><option>Other</option></select></div>
    <div class="det-field"><label>Source</label><select id="nSource"><option>google_maps</option><option>instagram</option><option>linkedin</option><option>referral</option><option>manual</option></select></div>
    <div class="det-field"><label>Notes</label><textarea id="nNotes"></textarea></div>
    <div class="det-actions"><button class="btn btn-primary" onclick="createLead()">Create Lead</button></div>`;
  document.getElementById('detPanel').classList.add('open');
  document.getElementById('detOverlay').classList.add('open');
}
async function createLead(){
  const data={company:document.getElementById('nCompany').value,contact_name:document.getElementById('nContact').value,contact_email:document.getElementById('nEmail').value,contact_phone:document.getElementById('nPhone').value,industry:document.getElementById('nIndustry').value,website:document.getElementById('nWeb').value,market:document.getElementById('nMarket').value,source:document.getElementById('nSource').value,notes:document.getElementById('nNotes').value};
  if(!data.company){alert('Company name required');return;}
  await api('/api/leads','POST',data);closeDet();await refresh();
}

// Maps
function openMaps(){document.getElementById('mapsModal').classList.add('open');loadMapUsage();}
async function loadMapUsage(){const r=await api('/api/maps/usage');document.getElementById('mapUsage').textContent='API: '+r.usage+'/'+r.limit+' this month';}
async function doMapSearch(){
  const q=document.getElementById('mapQ').value,l=document.getElementById('mapL').value;
  document.getElementById('mapResults').innerHTML='<div style="color:var(--muted);padding:20px;text-align:center">Searching...</div>';
  const r=await api('/api/maps/search?query='+encodeURIComponent(q)+'&location='+encodeURIComponent(l));
  loadMapUsage();
  if(!r||!r.results||!r.results.length){document.getElementById('mapResults').innerHTML='<div style="color:var(--muted);padding:20px;text-align:center">No results</div>';return;}
  document.getElementById('mapResults').innerHTML=r.results.map(b=>'<div class="modal-row"><div class="modal-biz"><div class="modal-biz-name">'+esc(b.name)+'</div><div class="modal-biz-addr">'+esc(b.address)+'</div><div class="modal-biz-rating">'+(b.rating?b.rating+' stars ('+b.reviews+')':'')+'</div></div><button class="btn btn-sm btn-primary" onclick="importBiz(\''+b.place_id+'\',\''+esc(b.name).replace(/'/g,'')+'\')">Import</button></div>').join('');
}
async function importBiz(pid,name){
  const d=await api('/api/maps/details/'+pid);
  const r=await api('/api/maps/import','POST',{name:d.name||name,phone:d.phone||'',website:d.website||'',address:d.address||'',rating:d.rating,reviews:d.reviews,industry:document.getElementById('mapQ').value});
  if(r&&r.ok){alert('Imported: '+(d.name||name));await refresh();}else{alert(r?.error||'Already exists');}
}

// Inbox
async function openInbox(){
  document.getElementById('inboxModal').classList.add('open');
  const r=await api('/api/gmail/inbox?query=is:unread&max_results=20');
  if(!r||!r.messages||!r.messages.length){document.getElementById('inboxList').innerHTML='<div style="color:var(--muted);padding:20px;text-align:center">No unread messages</div>';return;}
  document.getElementById('inboxList').innerHTML=r.messages.map(m=>'<div style="padding:10px;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">'+esc(m.from)+'</b><span style="font-size:10px;color:var(--muted)">'+esc(m.date)+'</span></div><div style="font-size:12px;margin-top:2px">'+esc(m.subject)+'</div><div style="font-size:11px;color:var(--muted);margin-top:2px">'+esc(m.snippet)+'</div></div>').join('');
}

refresh();
</script>
