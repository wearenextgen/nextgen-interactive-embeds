<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Gen Creative Systems — Selected Clients</title>
<!-- This element is decoration + motion only. The Squarespace section that embeds
     it owns the heading and the crawlable client links, so search engines never
     depend on anything inside this iframe. -->
<meta name="robots" content="noindex">
<style>
  /* Transparent throughout: the logos float directly on whatever the parent
     Squarespace section background is, so this never shows a panel or card. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  .rail {
    /* Fit the height Squarespace already gives this iframe. Making the logo
       boxes taller than the host iframe was what clipped whole marks. */
    --slot-w: clamp(104px, 13vw, 154px);
    --gap: clamp(1.5rem, 4vw, 3.5rem);
    --speed: 38s;
    display: flex;
    width: 100%;
    height: 100vh;
    min-height: 0;
    align-items: center;
    overflow: hidden;
    /* fade the ends so logos enter and leave instead of popping at a hard edge */
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
  }

  .track {
    display: flex;
    align-items: center;
    flex: none;
    width: max-content;
    animation: roll var(--speed) linear infinite;
    will-change: transform;
  }

  .sequence {
    display: flex;
    align-items: center;
    gap: var(--gap);
    flex: none;
    margin: 0;
    padding: 0 var(--gap) 0 0;
    list-style: none;
  }

  .rail:hover .track,
  .rail:focus-within .track { animation-play-state: paused; }

  .item { flex: 0 0 auto; }

  .item a {
    display: grid;
    place-items: center;
    /* a fixed box per logo is what stops wide wordmarks dwarfing square marks */
    width: var(--slot-w);
    height: 100vh;
    max-height: 58px;
    box-sizing: border-box;
    padding: clamp(4px, .65vw, 8px);
    opacity: .75;
    transition: opacity .25s ease, transform .25s ease;
  }

  .item a:hover,
  .item a:focus-visible { opacity: 1; transform: translateY(-2px); }

  .item a:focus-visible {
    outline: 2px solid #8115ff;
    outline-offset: 6px;
    border-radius: 2px;
  }

  .item img {
    /* Let the grid box constrain both axes. width:100% + height:100% allowed
       tall source canvases to establish an oversized intrinsic height before
       object-fit ran, which is why several logos disappeared vertically. */
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-position: center;
    display: block;
  }

  /* Grid items default to min-height:auto; explicitly zeroing it is what lets
     a tall logo shrink to the available row instead of overflowing the iframe. */
  .item a > img { min-width: 0; min-height: 0; }

  /* Squarish marks read smaller than wide wordmarks at the same box size,
     so they get a little extra room to balance the row optically. */
  .item.is-square a { width: clamp(84px, 10vw, 116px); }

  /* Meli's source mark fills more of its canvas than the surrounding
     wordmarks. This is optical normalization, not cropping. */
  .item.is-meli a { width: clamp(92px, 11vw, 128px); }
  .item.is-meli img { transform: scale(.72); }

  @media (max-width: 640px) {
    .rail {
      --slot-w: 112px;
      --gap: 1.3rem;
    }
    .item.is-square a { width: 72px; }
    .item.is-meli a { width: 88px; }
  }

  @keyframes roll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
    .rail { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
    .sequence[aria-hidden="true"] { display: none; }
  }
</style>
</head>
<body>

<div class="rail" role="region" aria-label="Selected clients">
  <div class="track" id="track">
    <ul class="sequence" id="sequence">
      <li class="item"><a href="https://wearenextgen.io/hospitality" target="_top" aria-label="View hospitality work featuring Rent All Mania"><img src="logos/rent-all-mania.png" alt="Rent All Mania" loading="eager" decoding="async"></a></li>
      <li class="item"><a href="https://wearenextgen.io/medical" target="_top" aria-label="View medical and wellness work featuring Back2Health"><img src="logos/b2h.png" alt="Back2Health" loading="eager" decoding="async"></a></li>
      <li class="item"><a href="https://wearenextgen.io/bill-and-john-1" target="_top" aria-label="View the Bill and John hospitality project"><img src="logos/bill-and-john.png" alt="Bill and John" loading="eager" decoding="async"></a></li>
      <li class="item"><a href="https://wearenextgen.io/projects/swell" target="_top" aria-label="View the Swell campaign project"><img src="logos/swell.png" alt="Swell" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/creative-play" target="_top" aria-label="View the Creative Play project"><img src="logos/creative-play.png" alt="Creative Play" loading="eager" decoding="async"></a></li>
      <li class="item"><a href="https://wearenextgen.io/newcult" target="_top" aria-label="View the New Cult fashion project"><img src="logos/new-cult.png" alt="New Cult" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/kids-pets" target="_top" aria-label="View kids and pets work featuring Under Dog"><img src="logos/underdog.png" alt="Under Dog" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/our-projects" target="_top" aria-label="Explore selected work featuring Big Mouth Company"><img src="logos/big-mouth-company.png" alt="Big Mouth Company" loading="eager" decoding="async"></a></li>
      <li class="item is-meli"><a href="https://wearenextgen.io/music" target="_top" aria-label="View artist and music work featuring Meli"><img src="logos/meli.png" alt="Meli" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/medical" target="_top" aria-label="View medical and wellness work featuring Mantalos"><img src="logos/mantalos.png" alt="Mantalos Plastic Surgery" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/wrc1" target="_top" aria-label="View the World Capital project"><img src="logos/world-capital.png" alt="World Capital" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/music" target="_top" aria-label="View artist and music work featuring Purple Being"><img src="logos/purple-being.png" alt="Purple Being" loading="eager" decoding="async"></a></li>
      <li class="item is-square"><a href="https://wearenextgen.io/ivan-greko" target="_top" aria-label="View the Ivan Greko project"><img src="logos/ivan-greko.png" alt="Ivan Greko" loading="eager" decoding="async"></a></li>
    </ul>
    <ul class="sequence" id="mirror" aria-hidden="true"></ul>
  </div>
</div>

<script>
(function () {
  var sequence = document.getElementById('sequence');
  var mirror = document.getElementById('mirror');

  // A logo that fails to load hides its slot rather than leaving a gap or a
  // broken-image icon. Blank cards are what made the previous breakage invisible.
  sequence.querySelectorAll('img').forEach(function (img) {
    img.addEventListener('error', function () {
      var li = img.closest('.item');
      if (li) li.remove();
      console.warn('[clients] logo failed:', img.alt);
      build();
    });
  });

  // translateX(-50%) only loops seamlessly while the mirror exactly matches the
  // source, so rebuild it whenever the source changes.
  function build() {
    mirror.innerHTML = sequence.innerHTML;
    mirror.querySelectorAll('a').forEach(function (a) { a.setAttribute('tabindex', '-1'); });
    mirror.querySelectorAll('img').forEach(function (img) { img.setAttribute('loading', 'lazy'); });
  }
  build();

  // Report our natural height so the Squarespace embed can size itself instead
  // of relying on a hardcoded iframe height that breaks at other breakpoints.
  function postHeight() {
    var h = Math.ceil(document.querySelector('.rail').getBoundingClientRect().height);
    if (window.parent !== window) {
      window.parent.postMessage({ ngEmbed: 'clients', height: h }, '*');
    }
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
}());
</script>

</body>
</html>
